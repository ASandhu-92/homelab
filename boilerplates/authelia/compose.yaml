---
# Authelia SSO / 2FA portal.
# Acts as the forward-auth backend for Traefik: every protected route asks
# Authelia whether the request is authenticated before it reaches a service.
#
# This template uses the file-based user backend and local (file) session +
# storage, which is the simplest production-capable setup. A Redis session
# store and a SQL storage backend are commented in configuration.yml for
# larger deployments.

networks:
  proxy:
    external: true
    name: proxy

services:
  authelia:
    image: authelia/authelia:4.39.28
    container_name: authelia
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Secrets are injected as *_FILE env vars pointing at mounted files, or
      # inline from .env. Never commit real values.
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
    volumes:
      - ./config:/config
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      # The login portal itself is public (no auth middleware, that would loop).
      - "traefik.http.routers.authelia.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authelia.entrypoints=websecure"
      - "traefik.http.routers.authelia.tls.certresolver=letsencrypt"
      - "traefik.http.services.authelia.loadbalancer.server.port=9091"
    healthcheck:
      test: ["CMD", "authelia", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
