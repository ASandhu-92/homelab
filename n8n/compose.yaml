# n8n: workflow automation, backed by PostgreSQL for durable execution data.
# SQLite is fine for a quick trial, but Postgres is the right call once you
# have real workflows, concurrency, or want reliable backups.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.30.5
    container_name: n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Behind a reverse proxy in production; raw port for local testing only.
      - "5678:5678"
    environment:
      # --- Database (Postgres) ---
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # --- Public URL / reverse proxy ---
      # WEBHOOK_URL must be the EXTERNAL https URL so webhook nodes hand out the
      # right callback address to third parties, even though n8n listens on http
      # internally. N8N_HOST/PROTOCOL let n8n build correct links behind a proxy.
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${WEBHOOK_URL}
      # Proxy sets X-Forwarded-*; trust exactly one hop so n8n sees real scheme.
      - N8N_PROXY_HOPS=1
      # --- Hardening ---
      # Encrypts stored credentials; MUST stay stable or saved creds break.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=${TZ}
    volumes:
      - n8n-data:/home/node/.n8n

  postgres:
    image: postgres:18-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      # Postgres 18 images keep data in a versioned subdirectory and refuse
      # to start if a volume is mounted at the old /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Gate n8n startup on the DB actually accepting connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  n8n-data:
  postgres-data:
