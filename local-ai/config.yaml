# LiteLLM router config. Each entry maps a public model name (what clients
# ask for) to a backend. Several names can point at the same backend, which
# lets clients use a stable alias ("default") while the model behind it
# changes.
model_list:
  - model_name: default
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://ollama:11434
      num_ctx: 32768
  - model_name: qwen3.5:9b
    litellm_params:
      model: ollama_chat/qwen3.5:9b
      api_base: http://ollama:11434
      num_ctx: 32768
  - model_name: qwen2.5-coder:7b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b
      api_base: http://ollama:11434
  # Tiny model that answers even on CPU; handy as a smoke test.
  - model_name: floor
    litellm_params:
      model: ollama_chat/llama3.2:1b
      api_base: http://ollama:11434
  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

litellm_settings:
  # Silently drop OpenAI parameters a local model does not support instead
  # of failing the request.
  drop_params: true
  request_timeout: 600
  num_retries: 2
  cache: true
  cache_params:
    type: redis
    host: cache
    port: 6379
    ttl: 3600

router_settings:
  num_retries: 2
  # If a model errors, retry the request on another one. In my lab the 9B
  # models fall back to a larger model on a second GPU server; with one
  # backend, fall back to the tiny model so a client still gets an answer.
  fallbacks:
    - {"default": ["floor"]}
