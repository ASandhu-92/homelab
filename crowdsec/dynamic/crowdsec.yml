# Traefik file-provider config: drop this into Traefik's dynamic/ directory.
# Add `crowdsec@file` to a router's middlewares, before the SSO middleware,
# so a banned IP is refused before it can even reach the login page.
http:
  middlewares:
    crowdsec:
      forwardAuth:
        address: http://crowdsec-bouncer:8080/api/v1/forwardAuth
        # Traefik is the first hop, so it is the one that sets
        # X-Forwarded-For. If Traefik sits behind a tunnel or another proxy,
        # configure forwardedHeaders.trustedIPs on the entrypoint instead of
        # trusting everything.
        trustForwardHeader: true
